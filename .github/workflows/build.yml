name: Build Jarvis APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create project
        run: |
          mkdir -p .
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'Jarvis'
          include ':app'
          EOF
          mkdir -p .
          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.5.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          mkdir -p app
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
            namespace 'com.jarvis.app'
            compileSdk 34
            defaultConfig { applicationId 'com.jarvis.app'; minSdk 29; targetSdk 34; versionCode 1; versionName '1.0' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
          }
          dependencies { implementation 'ai.picovoice:porcupine-android:3.0.2' }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.READ_CONTACTS"/>
            <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
            <queries><intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent></queries>
            <application android:label="Jarvis" android:theme="@android:style/Theme.DeviceDefault">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
              <service android:name=".JarvisService" android:exported="false" android:foregroundServiceType="microphone"/>
              <service android:name=".JarvisAccess" android:exported="false" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
                <meta-data android:name="android.accessibilityservice" android:resource="@xml/access"/>
              </service>
              <receiver android:name=".RemReceiver" android:exported="false"/>
            </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/access.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeWindowStateChanged" android:accessibilityFeedbackType="feedbackGeneric"
            android:canPerformGestures="true" android:description="@string/d"/>
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="d">Jarvis ऐप खोलने और स्क्रॉल करने के लिए</string></resources>
          EOF
          mkdir -p app/src/main/java/com/jarvis/app
          cat > app/src/main/java/com/jarvis/app/MainActivity.kt <<'EOF'
          package com.jarvis.app
          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.View
          import android.widget.*

          class MainActivity : Activity() {
            override fun onCreate(st: Bundle?) {
              super.onCreate(st)
              val sp = getSharedPreferences("j", 0)
              val l = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 80, 40, 40) }
              val orb = View(this); orb.background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(0xFF37D6FF.toInt()) }
              l.addView(orb, LinearLayout.LayoutParams(300, 300).apply { gravity = Gravity.CENTER_HORIZONTAL; bottomMargin = 60; topMargin = 20 })
              val hd = Handler(Looper.getMainLooper()); var ph = 0f
              hd.post(object : Runnable { override fun run() {
                val st = JarvisService.state
                ph += if (st == 1) 0.5f else if (st == 2) 0.35f else 0.06f
                val sn = Math.sin(ph.toDouble()).toFloat()
                val sc = 1f + (if (st == 1) 0.18f else if (st == 2) 0.12f else 0.05f) * sn
                orb.scaleX = sc; orb.scaleY = sc; orb.translationY = if (st == 0) 12f * sn else 0f
                (orb.background as GradientDrawable).setColor(when (st) { 1 -> 0xFFFF6B3D.toInt(); 2 -> 0xFF7DFFB2.toInt(); else -> 0xFF37D6FF.toInt() })
                hd.postDelayed(this, 40) } })
              fun f(h: String, k: String): EditText { val e = EditText(this); e.hint = h; e.setText(sp.getString(k, "")); l.addView(e); return e }
              val ek = f("ElevenLabs API key", "ek"); val ev = f("ElevenLabs Voice ID", "ev"); val pk = f("Picovoice Access Key", "pk")
              fun btn(t: String, r: () -> Unit) { val b = Button(this); b.text = t; b.setOnClickListener { r() }; l.addView(b) }
              btn("1. परमिशन दो") { requestPermissions(arrayOf(android.Manifest.permission.RECORD_AUDIO, android.Manifest.permission.READ_CONTACTS, android.Manifest.permission.POST_NOTIFICATIONS), 1) }
              btn("2. एक्सेसिबिलिटी में Jarvis चालू करो") { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
              btn("3. बैटरी: Jarvis को Unrestricted करो") { startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS)) }
              btn("4. सेव करो और जार्विस चालू करो") {
                sp.edit().putString("ek", ek.text.toString().trim()).putString("ev", ev.text.toString().trim()).putString("pk", pk.text.toString().trim()).apply()
                startForegroundService(Intent(this, JarvisService::class.java))
              }
              setContentView(ScrollView(this).apply { addView(l) })
            }
          }
          EOF
          mkdir -p app/src/main/java/com/jarvis/app
          cat > app/src/main/java/com/jarvis/app/JarvisAccess.kt <<'EOF'
          package com.jarvis.app
          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.net.Uri
          import android.view.accessibility.AccessibilityEvent

          class JarvisAccess : AccessibilityService() {
            companion object { var inst: JarvisAccess? = null }
            override fun onServiceConnected() { inst = this }
            override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
            override fun onInterrupt() {}
            override fun onDestroy() { inst = null; super.onDestroy() }
            fun openUrl(u: String) { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(u)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) }
            fun openApp(p: String) { packageManager.getLaunchIntentForPackage(p)?.let { startActivity(it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) } }
            fun swipe(up: Boolean) {
              val d = resources.displayMetrics; val x = d.widthPixels / 2f
              val a = d.heightPixels * (if (up) 0.75f else 0.25f); val b = d.heightPixels * (if (up) 0.25f else 0.75f)
              val p = Path().apply { moveTo(x, a); lineTo(x, b) }
              dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0, 250)).build(), null, null)
            }
          }
          EOF
          mkdir -p app/src/main/java/com/jarvis/app
          cat > app/src/main/java/com/jarvis/app/JarvisService.kt <<'EOF'
          package com.jarvis.app
          import ai.picovoice.porcupine.Porcupine
          import ai.picovoice.porcupine.PorcupineManager
          import ai.picovoice.porcupine.PorcupineManagerCallback
          import android.app.*
          import android.content.*
          import android.media.MediaPlayer
          import android.media.RingtoneManager
          import android.os.*
          import android.provider.ContactsContract
          import android.speech.*
          import android.speech.tts.TextToSpeech
          import org.json.JSONObject
          import java.io.File
          import java.net.*
          import java.util.Calendar
          import java.util.Locale

          class JarvisService : Service() {
            val h = Handler(Looper.getMainLooper())
            var pm: PorcupineManager? = null
            var sr: SpeechRecognizer? = null
            var mp: MediaPlayer? = null
            var tt: TextToSpeech? = null
            lateinit var sp: SharedPreferences
            companion object { @Volatile var state = 0 }
            override fun onBind(i: Intent?): IBinder? = null
            override fun onStartCommand(i: Intent?, f: Int, s: Int): Int {
              i?.getStringExtra("task")?.let { task -> Thread { ring(); say("आपका " + task + " का समय हो गया") }.start() }
              return START_STICKY
            }
            fun ring() { try { val r = RingtoneManager.getRingtone(this, RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)); r.play(); Thread.sleep(3500); r.stop() } catch (e: Exception) {} }

            override fun onCreate() {
              super.onCreate()
              sp = getSharedPreferences("j", 0)
              getSystemService(NotificationManager::class.java).createNotificationChannel(NotificationChannel("j", "Jarvis", NotificationManager.IMPORTANCE_LOW))
              val n = Notification.Builder(this, "j").setContentTitle("Jarvis सुन रहा है").setSmallIcon(android.R.drawable.ic_btn_speak_now).build()
              startForeground(1, n, 128)
              try {
                pm = PorcupineManager.Builder().setAccessKey(sp.getString("pk", "") ?: "").setKeyword(Porcupine.BuiltInKeyword.JARVIS)
                  .build(this, PorcupineManagerCallback { listen() })
                pm?.start()
                say("जार्विस तैयार है")
              } catch (e: Exception) { say("वेक वर्ड शुरू नहीं हुआ, Picovoice key जाँचिए") }
            }

            override fun onDestroy() { try { pm?.stop(); pm?.delete() } catch (e: Exception) {}; super.onDestroy() }

            fun resume() { state = 0; try { pm?.start() } catch (e: Exception) {} }

            fun listen() { h.post {
              try { pm?.stop() } catch (e: Exception) {}
              state = 1
              sr?.destroy()
              sr = SpeechRecognizer.createSpeechRecognizer(this)
              sr?.setRecognitionListener(object : RecognitionListener {
                override fun onResults(b: Bundle?) { val t = b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull(); resume(); if (t != null) handle(t) }
                override fun onError(e: Int) { resume() }
                override fun onReadyForSpeech(p: Bundle?) {}
                override fun onBeginningOfSpeech() {}
                override fun onRmsChanged(v: Float) {}
                override fun onBufferReceived(b: ByteArray?) {}
                override fun onEndOfSpeech() {}
                override fun onPartialResults(b: Bundle?) {}
                override fun onEvent(t: Int, b: Bundle?) {}
              })
              sr?.startListening(Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                .putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN"))
            } }

            fun phone(n: String): String? {
              val c = ContactsContract.CommonDataKinds.Phone.CONTENT_URI
              contentResolver.query(c, arrayOf(ContactsContract.CommonDataKinds.Phone.NUMBER), ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " LIKE ?", arrayOf("%" + n.trim() + "%"), null)?.use { r ->
                if (r.moveToFirst()) { val x = r.getString(0).filter { it.isDigit() }; return if (x.length == 10) "91$x" else x }
              }
              return null
            }

            fun handle(t: String) {
              val s = t.lowercase().trim()
              if (listOf("रिमाइंडर", "याद दिला", "अलार्म", "reminder").any { s.contains(it) }) {
                if (!remind(s)) say("समय समझ नहीं आया। ऐसे बोलिए: 5 बजे ट्यूशन का रिमाइंडर लगाओ"); return }
              val a = JarvisAccess.inst
              if (a == null) { say("पहले एक्सेसिबिलिटी में जार्विस चालू कीजिए"); return }
              Regex("याद रखो\\s*(.+?)\\s*(?:कि|की)\\s*(.+)").find(s)?.let {
                sp.edit().putString("m_" + it.groupValues[1].trim(), it.groupValues[2]).apply(); say(it.groupValues[1] + " सेव हो गया"); return }
              Regex("(.+?)\\s*को\\s*(?:व्हाट्सएप|whatsapp)?\\s*(?:पर)?\\s*(?:मैसेज)?\\s*(?:भेजो|बोलो|लिखो)\\s*(?:कि|की)?\\s*(.*)").find(s)?.let {
                val n = it.groupValues[1]; val num = phone(n)
                if (num == null) say(n + " का नंबर कॉन्टैक्ट में नहीं मिला") else {
                  a.openUrl("https://wa.me/" + num + "?text=" + URLEncoder.encode(it.groupValues[2], "UTF-8").replace("+", "%20")); say("मैसेज तैयार है, सेंड दबाइए") }
                return }
              Regex("(.+?)\\s*(?:बताओ|सुनाओ|क्या है)$").find(s)?.let {
                val v = sp.getString("m_" + it.groupValues[1].trim(), null); if (v != null) { say(v); return } }
              if (s.contains("शॉर्ट")) { a.openUrl("https://www.youtube.com/shorts"); say("शॉर्ट्स खोल रहा हूँ"); return }
              if (s.contains("अगला") || s.contains("ऊपर") || s.contains("next") || s.contains("स्क्रॉल")) { a.swipe(true); return }
              if (s.contains("पिछला") || s.contains("नीचे") || s.contains("previous")) { a.swipe(false); return }
              Regex("(.+?)\\s*(?:चलाओ|बजाओ|लगाओ)$").find(s)?.let {
                val q = it.groupValues[1].replace("यूट्यूब पर", "").replace("वीडियो", "").trim()
                a.openUrl("https://www.youtube.com/results?search_query=" + URLEncoder.encode(q, "UTF-8")); say(q + " खोज रहा हूँ"); return }
              if (s.contains("खोलो") || s.contains("ओपन") || s.contains("open")) {
                val al = mapOf("यूट्यूब" to "youtube", "इंस्टाग्राम" to "instagram", "व्हाट्सएप" to "whatsapp", "फेसबुक" to "facebook", "गूगल" to "google", "क्रोम" to "chrome",
                  "स्पॉटिफाई" to "spotify", "जीमेल" to "gmail", "मैप" to "maps", "टेलीग्राम" to "telegram", "कैमरा" to "camera", "सेटिंग" to "settings")
                var q = s; al.forEach { (k, v) -> q = q.replace(k, v) }
                q = q.replace("खोलो", "").replace("ओपन", "").replace("open", "").replace("करो", "").trim()
                val ri = packageManager.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)
                val r = ri.firstOrNull { it.loadLabel(packageManager).toString().lowercase().contains(q) }
                if (r != null) { a.openApp(r.activityInfo.packageName); say(q + " खोल रहा हूँ") } else say(q + " ऐप नहीं मिला")
                return
              }
              say("समझ नहीं आया")
            }

            fun schedule(t: Long, task: String) {
              val am = getSystemService(AlarmManager::class.java)
              val pi = PendingIntent.getBroadcast(this, (t % 100000000L).toInt(), Intent(this, RemReceiver::class.java).putExtra("task", task), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
              if (Build.VERSION.SDK_INT < 31 || am.canScheduleExactAlarms()) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, pi) else am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, pi)
            }

            fun remind(s: String): Boolean {
              var t: Long? = null; var rm = ""
              val rel = Regex("(\\d+)\\s*(मिनट|मिनिट|minute|min|घंटे|घंटा|hour)").find(s)
              if (rel != null) {
                t = System.currentTimeMillis() + rel.groupValues[1].toLong() * (if (Regex("घंट|hour").containsMatchIn(rel.groupValues[2])) 3600000L else 60000L); rm = rel.value
              } else {
                val ab = Regex("(\\d{1,2})(?:[:.\\s](\\d{2}))?\\s*बजे").find(s)
                if (ab != null) {
                  rm = ab.value; var h = ab.groupValues[1].toInt(); val mi = ab.groupValues[2].toIntOrNull() ?: 0
                  val pm = Regex("शाम|रात|दोपहर|pm").containsMatchIn(s); val am = Regex("सुबह|am").containsMatchIn(s)
                  fun mk(x: Int): Long { val c = Calendar.getInstance(); c.set(Calendar.HOUR_OF_DAY, x); c.set(Calendar.MINUTE, mi); c.set(Calendar.SECOND, 0); c.set(Calendar.MILLISECOND, 0); return c.timeInMillis }
                  if (pm && h < 12) h += 12
                  val c = mutableListOf(mk(h)); if (!pm && !am && h < 12) c.add(mk(h + 12))
                  val f = c.filter { it > System.currentTimeMillis() }.sorted()
                  t = if (f.isNotEmpty()) f[0] else mk(h) + 86400000L
                }
              }
              val tm = t ?: return false
              val stop = setOf("रिमाइंडर", "reminder", "याद", "दिलाओ", "दिलाना", "दिला", "दो", "अलार्म", "सेट", "लगाओ", "लगा", "करो", "बाद", "में", "के", "लिए", "का", "की", "कि", "मुझे", "शाम", "सुबह", "रात", "दोपहर", "बजे", "set", "me")
              val task = s.replace(rm, " ").split(Regex("\\s+")).filter { it.isNotEmpty() && it !in stop }.joinToString(" ").ifEmpty { "रिमाइंडर" }
              schedule(tm, task)
              val cl = Calendar.getInstance(); cl.timeInMillis = tm
              say(task + " का रिमाइंडर लग गया, " + cl.get(Calendar.HOUR) .let { if (it == 0) 12 else it } + ":" + "%02d".format(cl.get(Calendar.MINUTE)) + " पर बजेगा")
              return true
            }

            fun tts(t: String) { state = 2; h.postDelayed({ state = 0 }, 3500); tt = TextToSpeech(this) { tt?.language = Locale("hi", "IN"); tt?.speak(t, TextToSpeech.QUEUE_FLUSH, null, "x") } }

            fun say(t: String) { Thread {
              try {
                val k = sp.getString("ek", "") ?: ""; val v = sp.getString("ev", "") ?: ""
                val c = URL("https://api.elevenlabs.io/v1/text-to-speech/" + v).openConnection() as HttpURLConnection
                c.requestMethod = "POST"; c.doOutput = true
                c.setRequestProperty("xi-api-key", k); c.setRequestProperty("Content-Type", "application/json")
                c.outputStream.write(JSONObject().put("text", t).put("model_id", "eleven_multilingual_v2")
                  .put("voice_settings", JSONObject().put("stability", 0.3).put("similarity_boost", 0.85).put("style", 0.6)).toString().toByteArray())
                val f = File(cacheDir, "s.mp3"); f.outputStream().use { c.inputStream.copyTo(it) }
                h.post { mp?.release(); state = 2; mp = MediaPlayer().apply { setDataSource(f.path); prepare(); setOnCompletionListener { state = 0 }; start() } }
              } catch (e: Exception) { h.post { tts(t) } }
            }.start() }
          }
          EOF
          mkdir -p app/src/main/java/com/jarvis/app
          cat > app/src/main/java/com/jarvis/app/RemReceiver.kt <<'EOF'
          package com.jarvis.app
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class RemReceiver : BroadcastReceiver() {
            override fun onReceive(c: Context, i: Intent) {
              c.startForegroundService(Intent(c, JarvisService::class.java).putExtra("task", i.getStringExtra("task") ?: "रिमाइंडर"))
            }
          }
          EOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: app/build/outputs/apk/debug/app-debug.apk
